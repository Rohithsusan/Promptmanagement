<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PromptVault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f7;
  --surface:#ffffff;
  --surface2:#fafafa;
  --surface3:#f0f0f3;
  --border:#e5e5ea;
  --border2:#d1d1d6;
  --text:#1c1c1e;
  --text2:#2e2e2f;
  --text3:#4b4b4b;
  --text4:#aeaeb2;
  --accent:#000000;
  --accent-hover:#0077ed;
  --accent-light:#e8f1fd;
  --accent-border:#c7defa;
  --green:#34c759;
  --green-bg:#edf9f1;
  --amber:#ff9f0a;
  --amber-bg:#fff5e6;
  --red:#ff3b30;
  --red-bg:#fff0ef;
  --teal:#30b0c7;
  --teal-bg:#eaf6f9;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
  --shadow:0 4px 16px rgba(0,0,0,0.06),0 1px 4px rgba(0,0,0,0.04);
  --shadow-lg:0 12px 40px rgba(0,0,0,0.10),0 2px 8px rgba(0,0,0,0.06);
  --radius:10px;
  --radius-lg:14px;
  --radius-xl:20px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.6;overflow:hidden;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:240px 1fr;height:100vh}

/* SIDEBAR */
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-logo{padding:24px 20px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}
.logo-mark{width:34px;height:34px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;font-size:16px;font-weight:700;color:#fff;letter-spacing:-0.5px;flex-shrink:0}
.logo-text{font-size:15px;font-weight:600;color:var(--text);letter-spacing:-0.3px}
.logo-sub{font-size:10px;color:var(--text3);font-family:'JetBrains Mono',monospace;margin-top:1px;letter-spacing:0.2px}
.sidebar-nav{padding:16px 12px;flex:1;overflow-y:auto}
.nav-section{margin-bottom:24px}
.nav-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text4);padding:0 8px;margin-bottom:4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--text2);transition:all 0.15s ease;font-size:13.5px;font-weight:400;border:none;background:transparent;position:relative}
.nav-item:hover{background:var(--surface3);color:var(--text)}
.nav-item.active{background:var(--accent-light);color:var(--accent);font-weight:500}
.nav-icon{width:20px;font-size:15px;display:flex;align-items:center;justify-content:center;opacity:0.85}
.nav-badge{margin-left:auto;background:var(--accent);color:#fff;font-size:10px;font-weight:600;padding:1px 7px;border-radius:20px;font-family:'JetBrains Mono',monospace}
.sidebar-footer{padding:16px 12px;border-top:1px solid var(--border)}
.stats-pill{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 12px;display:flex;justify-content:space-around}
.stat-item{text-align:center}
.stat-num{font-size:18px;font-weight:600;font-family:'JetBrains Mono',monospace;color:var(--text);letter-spacing:-0.5px}
.stat-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.6px;margin-top:2px}

/* MAIN */
.main{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.topbar{padding:0 28px;height:56px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--surface)}
.topbar-title{font-size:16px;font-weight:600;flex:1;color:var(--text);letter-spacing:-0.3px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--border2);background:var(--surface);color:var(--text2);transition:all 0.15s ease;font-family:inherit;line-height:1}
.btn:hover{background:var(--surface3);color:var(--text);border-color:var(--border2)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 1px 3px rgba(0,113,227,0.3)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-sm{padding:6px 12px;font-size:12px}
.content{flex:1;overflow-y:auto;padding:28px}

/* INBOX */
.inbox-layout{display:grid;grid-template-columns:1fr 288px;gap:24px}
.paste-area{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:24px;margin-bottom:20px;box-shadow:var(--shadow-sm);transition:border-color 0.15s}
.paste-area.focused{border-color:var(--accent)}
.paste-label{font-size:12px;color:var(--text3);margin-bottom:10px;font-weight:500;letter-spacing:0.1px}
textarea.paste-input{width:100%;min-height:148px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;font-size:13px;color:var(--text);font-family:'JetBrains Mono',monospace;resize:vertical;outline:none;transition:border-color 0.15s;line-height:1.7}
textarea.paste-input::placeholder{color:var(--text4)}
textarea.paste-input:focus{border-color:var(--accent);background:#fff}

/* METADATA EDITOR */
.metadata-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;margin-bottom:20px;box-shadow:var(--shadow-sm)}
.metadata-title{font-size:12px;font-weight:600;color:var(--text3);margin-bottom:18px;display:flex;align-items:center;gap:7px;text-transform:uppercase;letter-spacing:0.6px}
.metadata-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:16px}
.metadata-field{display:flex;flex-direction:column;gap:6px}
.metadata-field label{font-size:11px;color:var(--text3);font-weight:500;letter-spacing:0.2px}
.metadata-field input,.metadata-field select{padding:9px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none;font-family:inherit;transition:border-color 0.15s,background 0.15s;-webkit-appearance:none}
.metadata-field input:focus,.metadata-field select:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(0,113,227,0.08)}
.tags-input-container{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;min-height:42px;transition:border-color 0.15s}
.tags-input-container:focus-within{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(0,113,227,0.08)}
.tag-chip{display:inline-flex;align-items:center;gap:4px;background:var(--accent-light);color:var(--accent);padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:500;border:1px solid var(--accent-border)}
.tag-chip button{background:none;border:none;color:var(--text3);cursor:pointer;margin-left:2px;font-size:13px;line-height:1;display:flex;align-items:center;padding:0;transition:color 0.1s}
.tag-chip button:hover{color:var(--red)}
.tags-input{flex:1;min-width:80px;background:none;border:none;color:var(--text);font-size:12.5px;outline:none;font-family:inherit}
.tags-input::placeholder{color:var(--text4)}
.suggestions{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.suggestion-tag{background:var(--surface3);color:var(--text2);padding:3px 10px;border-radius:16px;font-size:11px;font-weight:500;cursor:pointer;transition:all 0.15s;border:1px solid var(--border)}
.suggestion-tag:hover{background:var(--accent-light);color:var(--accent);border-color:var(--accent-border)}

/* SIMILARITY PANEL */
.similarity-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;margin-bottom:20px;box-shadow:var(--shadow-sm)}
.similarity-item{margin-bottom:12px}
.similarity-header{display:flex;justify-content:space-between;margin-bottom:4px;font-size:11px}
.similarity-bar{height:3px;background:var(--surface3);border-radius:2px;overflow:hidden}
.similarity-fill{height:100%;background:var(--green);transition:width 0.4s ease;border-radius:2px}
.match-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-top:12px;cursor:pointer;transition:all 0.15s}
.match-card:hover{border-color:var(--border2);background:#fff;box-shadow:var(--shadow-sm)}
.match-title{font-size:12.5px;font-weight:500;margin-bottom:3px;color:var(--text)}
.match-similarity{font-size:11px;color:var(--green);font-weight:500;margin-bottom:6px}
.word-diff-container{background:var(--surface3);border-radius:8px;padding:10px 12px;margin-top:10px}
.word-diff-title{font-size:10.5px;color:var(--text3);margin-bottom:6px;font-weight:500;text-transform:uppercase;letter-spacing:0.4px}
.word-added{color:var(--green);background:var(--green-bg);padding:1px 5px;border-radius:4px;margin:0 2px;display:inline-block;font-size:11px}
.word-removed{color:var(--red);background:var(--red-bg);padding:1px 5px;border-radius:4px;text-decoration:line-through;margin:0 2px;display:inline-block;font-size:11px}
.word-unchanged{color:var(--text3);display:inline-block;font-size:11px}

/* SAVE CTA */
.ai-result{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;display:none;box-shadow:var(--shadow-sm)}
.ai-result.visible{display:block;animation:slideIn 0.25s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

/* TAGS */
.tag{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500;background:var(--accent-light);color:var(--accent);border:1px solid var(--accent-border)}
.tag.cat{background:var(--teal-bg);color:var(--teal);border-color:rgba(48,176,199,0.25)}
.tag.tool{background:var(--amber-bg);color:var(--amber);border-color:rgba(255,159,10,0.25)}
.tag.family{background:var(--surface3);color:var(--text2);border-color:var(--border2)}

/* LIBRARY TOGGLE */
.lib-toggle{display:flex;gap:2px;margin-bottom:22px;background:var(--surface3);padding:4px;border-radius:10px;width:fit-content;border:1px solid var(--border)}
.toggle-btn{padding:7px 18px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:500;transition:all 0.18s;background:transparent;color:var(--text3);border:none;font-family:inherit}
.toggle-btn.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}

/* LIBRARY SEARCH */
.lib-header{margin-bottom:20px}
.lib-search{position:relative;max-width:320px}
.lib-search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:13px;opacity:0.5;pointer-events:none}
.lib-search input{width:100%;padding:9px 12px 9px 34px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);font-size:13px;color:var(--text);outline:none;font-family:inherit;transition:border-color 0.15s}
.lib-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,227,0.08)}
.lib-search input::placeholder{color:var(--text4)}

/* CARDS */
.prompt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.prompt-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;cursor:pointer;transition:all 0.18s ease;box-shadow:var(--shadow-sm)}
.prompt-card:hover{border-color:var(--border2);box-shadow:var(--shadow);transform:translateY(-1px)}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.card-title{font-size:13.5px;font-weight:600;flex:1;color:var(--text);letter-spacing:-0.2px;line-height:1.4}
.card-star{background:none;border:none;color:var(--text4);cursor:pointer;font-size:16px;padding:0;margin-left:8px;transition:color 0.15s;line-height:1}
.card-star:hover{color:var(--amber)}
.card-star.starred{color:var(--amber)}
.card-preview{font-size:12.5px;color:var(--text3);margin-bottom:14px;line-height:1.6}
.card-footer{display:flex;justify-content:space-between;align-items:center}
.card-tags{display:flex;gap:4px;flex-wrap:wrap}
.card-time{font-size:10.5px;color:var(--text4);font-family:'JetBrains Mono',monospace}
.card-similarity-badge{font-size:10px;background:var(--green-bg);color:var(--green);padding:2px 8px;border-radius:10px;font-weight:500;border:1px solid rgba(52,199,89,0.2)}

/* RECENT SIDEBAR */
.recent-list{display:flex;flex-direction:column;gap:8px}
.recent-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all 0.15s;box-shadow:var(--shadow-sm)}
.recent-row:hover{border-color:var(--border2);box-shadow:var(--shadow)}
.recent-row-icon{width:32px;height:32px;background:var(--surface3);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.family-badge{background:var(--amber-bg);color:var(--amber);padding:1px 8px;border-radius:10px;font-size:10px;font-weight:500;margin-left:6px;border:1px solid rgba(255,159,10,0.2)}

/* FAMILIES */
.family-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.family-item-row{padding:10px 12px;margin:4px 0;background:var(--surface2);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all 0.15s}
.family-item-row:hover{background:#fff;border-color:var(--border2)}

/* MODAL */
.empty-state{text-align:center;padding:72px 20px;color:var(--text3)}
.empty-state-icon{font-size:32px;margin-bottom:12px;opacity:0.4}
.empty-state-text{font-size:14px;font-weight:500;color:var(--text3)}
.empty-state-sub{font-size:12.5px;color:var(--text4);margin-top:4px}

.toast{position:fixed;bottom:24px;right:24px;background:var(--text);color:#fff;padding:10px 18px;border-radius:var(--radius);font-size:12.5px;font-weight:500;z-index:2000;opacity:0;transform:translateY(8px);transition:all 0.25s ease;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translateY(0)}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;z-index:1000;display:none;backdrop-filter:blur(4px)}
.modal-overlay.visible{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:28px;width:620px;max-width:90vw;max-height:82vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.modal-title{font-size:17px;font-weight:600;color:var(--text);letter-spacing:-0.3px;line-height:1.3;padding-right:16px}
.modal-close{background:var(--surface3);border:1px solid var(--border);color:var(--text2);cursor:pointer;font-size:14px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all 0.15s;flex-shrink:0}
.modal-close:hover{background:var(--surface);color:var(--text);border-color:var(--border2)}
.prompt-full{font-family:'JetBrains Mono',monospace;font-size:12.5px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;white-space:pre-wrap;margin-bottom:18px;color:var(--text);line-height:1.7}
.modal-meta{font-size:11.5px;color:var(--text3);margin-bottom:18px;padding:12px 14px;background:var(--surface2);border-radius:8px}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark">P</div>
      <div>
        <div class="logo-text">Prompt-Manager</div>
        <div class="logo-sub">Smart Tagging</div>
      </div>
    </div>
    <div class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-label">Workspace</div>
        <div class="nav-item active" onclick="showPage('inbox')"><div class="nav-icon">&#128233;</div><span>Inbox</span><div class="nav-badge" id="inbox-badge">0</div></div>
        <div class="nav-item" onclick="showPage('library')"><div class="nav-icon">&#128218;</div><span>Library</span></div>
        <div class="nav-item" onclick="showPage('families')"><div class="nav-icon">&#129516;</div><span>Families</span></div>
      </div>
      <div class="nav-section">
        <div class="nav-label">Organize</div>
        <div class="nav-item" onclick="showPage('favorites')"><div class="nav-icon">&#9733;</div><span>Favorites</span></div>
        <div class="nav-item" onclick="showPage('recent')"><div class="nav-icon">&#128337;</div><span>Recent</span></div>
      </div>
    </div>
    <div class="sidebar-footer">
      <div class="stats-pill">
        <div class="stat-item">
          <div class="stat-num" id="stat-total">0</div>
          <div class="stat-lbl">Prompts</div>
        </div>
        <div class="stat-item">
          <div class="stat-num" id="stat-fam">0</div>
          <div class="stat-lbl">Families</div>
        </div>
        <div class="stat-item">
          <div class="stat-num" id="stat-fav">0</div>
          <div class="stat-lbl">Fav</div>
        </div>
      </div>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="topbar-title">Inbox</div>
      <div class="topbar-actions" id="topbar-actions"></div>
    </div>
    <div class="content" id="content-area"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title"></div>
      <button class="modal-close" onclick="closeModal()">&#10005;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// STATE
let DB = { prompts: [], families: {}, recentActivity: [] };
let currentPage = 'inbox';
let currentPastedText = '';
let currentSuggestions = { title: '', tags: [], category: 'Other', tool: 'Unknown', family: '' };
let similarPrompts = [];
let libraryFilterMode = 'all'; // 'all' or 'unique'

// Save data to localStorage
function saveToLocalStorage() {
  const dataToSave = {
    prompts: DB.prompts,
    recentActivity: DB.recentActivity,
    version: '1.0'
  };
  localStorage.setItem('promptvault_data', JSON.stringify(dataToSave));
  console.log('Data saved to localStorage');
}

// Load data from localStorage
function loadFromLocalStorage() {
  const savedData = localStorage.getItem('promptvault_data');
  if(savedData) {
    try {
      const parsed = JSON.parse(savedData);
      DB.prompts = parsed.prompts;
      DB.recentActivity = parsed.recentActivity;
      console.log('Data loaded from localStorage:', DB.prompts.length, 'prompts');
      return true;
    } catch(e) {
      console.error('Failed to parse saved data:', e);
      return false;
    }
  }
  return false;
}

// SAMPLE DATA (only used if no saved data exists)
const SAMPLE_PROMPTS = [
  {id:'p1', title:'SaaS Dashboard UI', text:'Create a modern SaaS dashboard with a clean sidebar, key metrics at the top, and a revenue chart.', tags:['ui','dashboard'], category:'UI Design', tool:'Claude', family:'', version:'Base', starred:true, created: Date.now()-86400000*5, usedAt: Date.now()-3600000, lastEdited: Date.now()-86400000*5, similarityToParent:0},
  {id:'p2', title:'Blog SEO Guide', text:'Write an SEO-optimized blog post with H1 title, subheadings, and meta description.', tags:['seo','blog'], category:'Marketing', tool:'ChatGPT', family:'', version:'Base', starred:false, created: Date.now()-86400000*3, usedAt: Date.now()-7200000, lastEdited: Date.now()-86400000*3, similarityToParent:0},
];

// Initialize data
function initializeData() {
  const hasSavedData = loadFromLocalStorage();
  if(!hasSavedData) {
    DB.prompts = [...SAMPLE_PROMPTS];
    DB.recentActivity = ['p1','p2'];
    console.log('Using sample data');
  }
  autoDetectAndBuildFamilies();
  saveToLocalStorage(); // Save initial state
}

// Calculate similarity between two texts
function calculateSimilarity(text1, text2) {
  const words1 = new Set(text1.toLowerCase().split(/\s+/));
  const words2 = new Set(text2.toLowerCase().split(/\s+/));
  const intersection = [...words1].filter(w => words2.has(w));
  return intersection.length / Math.max(words1.size, words2.size);
}

// Get word differences between two texts
function getWordDiff(newText, oldText) {
  const newWords = newText.toLowerCase().split(/\s+/);
  const oldWords = oldText.toLowerCase().split(/\s+/);
  const oldSet = new Set(oldWords);
  const newSet = new Set(newWords);

  const added = newWords.filter(w => !oldSet.has(w));
  const removed = oldWords.filter(w => !newSet.has(w));
  const common = newWords.filter(w => oldSet.has(w));

  return { added: [...new Set(added)], removed: [...new Set(removed)], common: [...new Set(common)] };
}

// Highlight word differences
function highlightWordDiff(newText, oldText) {
  if(!oldText) return escapeHtml(newText);
  const { added, removed, common } = getWordDiff(newText, oldText);
  let result = '';
  const words = newText.toLowerCase().split(/\s+/);

  for(let word of words) {
    if(added.includes(word)) {
      result += `<span class="word-added">+${escapeHtml(word)}</span> `;
    } else if(common.includes(word)) {
      result += `<span class="word-unchanged">${escapeHtml(word)}</span> `;
    } else {
      result += escapeHtml(word) + ' ';
    }
  }
  return result;
}

// Auto-detect families based on similarity
function autoDetectAndBuildFamilies() {
  DB.families = {};

  // Reset family assignments
  DB.prompts.forEach(p => p.family = '');

  const similarities = [];
  for(let i = 0; i < DB.prompts.length; i++) {
    for(let j = i + 1; j < DB.prompts.length; j++) {
      const sim = calculateSimilarity(DB.prompts[i].text, DB.prompts[j].text);
      if(sim > 0.25) {
        similarities.push({ p1: DB.prompts[i], p2: DB.prompts[j], sim: sim });
      }
    }
  }

  similarities.sort((a,b) => b.sim - a.sim);
  const usedPrompts = new Set();

  for(let sim of similarities) {
    if(!usedPrompts.has(sim.p1.id) && !usedPrompts.has(sim.p2.id)) {
      const familyName = sim.p1.title.split(' ').slice(0, 2).join(' ') + ' Family';
      sim.p1.family = familyName;
      sim.p2.family = familyName;
      usedPrompts.add(sim.p1.id);
      usedPrompts.add(sim.p2.id);

      if(!DB.families[familyName]) {
        DB.families[familyName] = { prompts: [], icon: '', color: '#0071e3' };
      }
      DB.families[familyName].prompts.push(sim.p1.id, sim.p2.id);
    }
  }
}

function showPage(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  if(event?.currentTarget) event.currentTarget.classList.add('active');
  const titles = {inbox:'Inbox',library:'Library',families:'Families',favorites:'Favorites',recent:'Recently Used'};
  document.getElementById('topbar-title').textContent = titles[page]||page;
  const pages = {inbox:renderInbox,library:renderLibrary,families:renderFamilies,favorites:renderFavorites,recent:renderRecent};
  if(pages[page]) pages[page]();
  updateStats();
}

function updateStats() {
  autoDetectAndBuildFamilies();
  document.getElementById('stat-total').textContent = DB.prompts.length;
  document.getElementById('stat-fam').textContent = Object.keys(DB.families).length;
  document.getElementById('stat-fav').textContent = DB.prompts.filter(p=>p.starred).length;
  document.getElementById('inbox-badge').textContent = DB.prompts.length;
  saveToLocalStorage(); // Save after any stats change
}

function showToast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }
function sleep(ms) { return new Promise(r=>setTimeout(r,ms)); }
function timeAgo(ts) { const s=Math.floor((Date.now()-ts)/1000); if(s<60) return 'just now'; const m=Math.floor(s/60); if(m<60) return m+'m ago'; const h=Math.floor(m/60); if(h<24) return h+'h ago'; return Math.floor(h/24)+'d ago'; }
function formatDateTime(ts) { return new Date(ts).toLocaleString(); }
function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m=>m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }

function generateSuggestions(text) {
  const lower = text.toLowerCase();
  let title = text.split(' ').slice(0, 6).join(' ');
  if(title.length > 50) title = title.substring(0, 47) + '...';

  let tags = [];
  if(lower.includes('ui') || lower.includes('design') || lower.includes('dashboard')) tags.push('ui');
  if(lower.includes('code') || lower.includes('react') || lower.includes('javascript')) tags.push('code');
  if(lower.includes('seo') || lower.includes('blog') || lower.includes('content')) tags.push('seo');
  if(lower.includes('marketing') || lower.includes('campaign')) tags.push('marketing');
  if(lower.includes('youtube') || lower.includes('video')) tags.push('youtube');
  if(lower.includes('dark') || lower.includes('dark mode')) tags.push('dark-mode');
  if(lower.includes('mobile')) tags.push('mobile');
  if(tags.length === 0) tags = ['prompt'];

  let category = 'Other';
  if(lower.includes('dashboard') || lower.includes('ui') || lower.includes('design')) category = 'UI Design';
  else if(lower.includes('code') || lower.includes('react') || lower.includes('api')) category = 'Coding';
  else if(lower.includes('seo') || lower.includes('blog') || lower.includes('marketing')) category = 'Marketing';
  else if(lower.includes('youtube') || lower.includes('video')) category = 'YouTube';

  let tool = 'Unknown';
  if(lower.includes('claude')) tool = 'Claude';
  else if(lower.includes('chatgpt') || lower.includes('gpt')) tool = 'ChatGPT';
  else if(lower.includes('midjourney')) tool = 'Midjourney';

  return { title, tags, category, tool };
}

function findSimilarPrompts(text) {
  return DB.prompts.map(p => ({
    ...p,
    similarity: calculateSimilarity(text, p.text),
    wordDiff: getWordDiff(text, p.text)
  })).filter(p => p.similarity > 0.15).sort((a,b) => b.similarity - a.similarity).slice(0, 3);
}

              <select id="prompt-category" onchange="updateCategorySuggestions(this.value)">

              </div>
              <div class="suggestions" id="tag-suggestions"></div>
            </div>
            <div class="metadata-field">
              <label>AI Tool</label>
              <select id="prompt-tool">

              </select>
            </div>
          </div>
        </div>

        <div class="similarity-panel" id="similarity-panel" style="display:none">
          <div class="metadata-title">Step 3 &mdash; Similar prompts</div>

        </div>

        <div class="ai-result" id="ai-result">
          <button class="btn btn-primary" style="width:100%;justify-content:center;padding:11px 20px;font-size:13.5px" onclick="savePromptWithMetadata()">Save to Library</button>
        </div>

      <div>
        <div class="metadata-title" style="margin-bottom:14px;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.6px">Recent Prompts</div>

          ${DB.prompts.slice(-5).reverse().map(p => `
            <div class="recent-row" onclick="openPromptModal('${p.id}')">
              <div class="recent-row-icon">&#128196;</div>
              <div style="min-width:0">
                <div style="font-size:12.5px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(p.title)}</div>
                <div style="font-size:11px;color:var(--text4);margin-top:1px">${timeAgo(p.created)}</div>
              </div>

          `).join('')}

      </div>
    </div>
  `;
}

function onPasteInput() {
  const text = document.getElementById('paste-input').value.trim();
  if(text.length < 20) return;

  currentPastedText = text;
  currentSuggestions = generateSuggestions(text);
  similarPrompts = findSimilarPrompts(text);

  document.getElementById('metadata-section').style.display = 'block';
  document.getElementById('similarity-panel').style.display = 'block';
  document.getElementById('ai-result').classList.add('visible');

  document.getElementById('prompt-title').value = currentSuggestions.title;
  document.getElementById('prompt-category').value = currentSuggestions.category;
  document.getElementById('prompt-tool').value = currentSuggestions.tool;

  renderTags(currentSuggestions.tags);
  renderTagSuggestions(currentSuggestions.tags);
  renderSimilarPrompts();
}

function renderTags(tags) {
  const container = document.getElementById('tag-list');
  container.innerHTML = tags.map(tag => `
    <span class="tag-chip">${escapeHtml(tag)}<button onclick="removeTag('${tag}')">&#215;</button></span>
  `).join('');
}

function renderTagSuggestions(existingTags) {
  const allSuggestions = ['ui', 'design', 'dashboard', 'code', 'react', 'api', 'seo', 'blog', 'marketing', 'youtube', 'dark-mode', 'mobile', 'responsive', 'testing', 'database'];
  const available = allSuggestions.filter(s => !existingTags.includes(s)).slice(0, 8);
  const container = document.getElementById('tag-suggestions');
  if(available.length) {
    container.innerHTML = `<span style="font-size:10.5px;color:var(--text4)">Suggestions:</span> ` +
      available.map(s => `<span class="suggestion-tag" onclick="addSuggestionTag('${s}')">+ ${s}</span>`).join('');
  } else {
    container.innerHTML = '';
  }
}

function addSuggestionTag(tag) {
  if(!currentSuggestions.tags.includes(tag)) {
    currentSuggestions.tags.push(tag);
    renderTags(currentSuggestions.tags);
    renderTagSuggestions(currentSuggestions.tags);
  }
}

function removeTag(tag) {
  currentSuggestions.tags = currentSuggestions.tags.filter(t => t !== tag);
  renderTags(currentSuggestions.tags);
  renderTagSuggestions(currentSuggestions.tags);
}

function handleTagKeydown(e) {
  if(e.key === 'Enter' && e.target.value.trim()) {
    e.preventDefault();
    const newTag = e.target.value.trim().toLowerCase();
    if(!currentSuggestions.tags.includes(newTag) && newTag.length > 1) {
      currentSuggestions.tags.push(newTag);
      renderTags(currentSuggestions.tags);
      renderTagSuggestions(currentSuggestions.tags);
    }
    e.target.value = '';
  }
}

function updateTitleSuggestions(val) { currentSuggestions.title = val; }
function updateCategorySuggestions(val) { currentSuggestions.category = val; }

function renderSimilarPrompts() {
  const container = document.getElementById('similar-prompts-list');
  if(similarPrompts.length === 0) {
    container.innerHTML = '<div style="font-size:12.5px;color:var(--text3)">No similar prompts found.</div>';
    return;
  }
  container.innerHTML = similarPrompts.map(p => `
    <div class="match-card" onclick="loadSimilarPrompt('${p.id}')">
      <div class="match-title">${escapeHtml(p.title)}</div>
      <div class="match-similarity">${(p.similarity * 100).toFixed(0)}% match</div>
      <div class="similarity-bar"><div class="similarity-fill" style="width:${p.similarity * 100}%"></div></div>
      ${p.wordDiff.added.length > 0 || p.wordDiff.removed.length > 0 ? `
        <div class="word-diff-container">
          <div class="word-diff-title">Text differences</div>
          <div style="line-height:1.8">
            ${p.wordDiff.added.slice(0,5).map(w => `<span class="word-added">+${escapeHtml(w)}</span>`).join(' ')}
            ${p.wordDiff.removed.slice(0,5).map(w => `<span class="word-removed">-${escapeHtml(w)}</span>`).join(' ')}
            ${p.wordDiff.added.length > 5 ? '<span class="word-unchanged">...</span>' : ''}
          </div>
        </div>
      ` : ''}
    </div>
  `).join('');
}

function loadSimilarPrompt(id) {
  const p = DB.prompts.find(x => x.id === id);
  if(p) {
    currentSuggestions.tags = [...new Set([...currentSuggestions.tags, ...p.tags])];
    renderTags(currentSuggestions.tags);
    renderTagSuggestions(currentSuggestions.tags);
    showToast(`Loaded tags from "${p.title}"`);
  }
}

function savePromptWithMetadata() {
  const title = document.getElementById('prompt-title').value.trim();
  if(!title) { showToast('Please enter a title'); return; }
  if(!currentPastedText) { showToast('Please paste a prompt first'); return; }

  const newId = 'p' + Date.now();
  const now = Date.now();

  // Find best match for family assignment
  let bestMatch = null;
  let bestSimilarity = 0;
  for(let p of DB.prompts) {
    const sim = calculateSimilarity(currentPastedText, p.text);
    if(sim > bestSimilarity && sim > 0.25) {
      bestSimilarity = sim;
      bestMatch = p;
    }
  }

  const newPrompt = {
    id: newId,
    title: title,
    text: currentPastedText,
    tags: currentSuggestions.tags,
    category: document.getElementById('prompt-category').value,
    tool: document.getElementById('prompt-tool').value,
    family: bestMatch ? (bestMatch.family || bestMatch.title.split(' ').slice(0,2).join(' ') + ' Family') : '',
    version: bestMatch ? 'Variant' : 'Base',
    starred: false,
    created: now,
    usedAt: now,
    lastEdited: now,
    similarityToParent: bestSimilarity
  };

  DB.prompts.push(newPrompt);
  DB.recentActivity.unshift(newId);
  if(DB.recentActivity.length > 20) DB.recentActivity.pop();

  // Rebuild families
  autoDetectAndBuildFamilies();

  updateStats();
  saveToLocalStorage(); // Save after adding new prompt
  showToast(`"${title}" saved to library`);

  document.getElementById('paste-input').value = '';
  document.getElementById('metadata-section').style.display = 'none';
  document.getElementById('similarity-panel').style.display = 'none';
  document.getElementById('ai-result').classList.remove('visible');
  currentPastedText = '';
  currentSuggestions = { title: '', tags: [], category: 'Other', tool: 'Unknown', family: '' };

  renderInbox();
}

// Get prompts that are in families (have similar counterparts)
function getPromptsInFamilies() {
  const inFamilies = new Set();
  Object.values(DB.families).forEach(fam => {
    fam.prompts.forEach(id => inFamilies.add(id));
  });
  return inFamilies;
}

// Get unique prompts (no similar prompts in library)
function getUniquePrompts() {
  const inFamilies = getPromptsInFamilies();
  return DB.prompts.filter(p => !inFamilies.has(p.id));
}

function renderLibrary() {
  autoDetectAndBuildFamilies();

  let promptsToShow = [];
  if(libraryFilterMode === 'unique') {
    promptsToShow = getUniquePrompts();
  } else {
    promptsToShow = [...DB.prompts];
  }

  promptsToShow = promptsToShow.reverse();
  const inFamilies = getPromptsInFamilies();

  document.getElementById('content-area').innerHTML = `
    <div class="lib-toggle">
      <button class="toggle-btn ${libraryFilterMode === 'all' ? 'active' : ''}" onclick="setLibraryFilter('all')">All Prompts (${DB.prompts.length})</button>
      <button class="toggle-btn ${libraryFilterMode === 'unique' ? 'active' : ''}" onclick="setLibraryFilter('unique')">Unique (${getUniquePrompts().length})</button>
    </div>
    <div class="lib-header">
      <div class="lib-search">
        <span class="lib-search-icon">&#128269;</span>
        <input type="text" placeholder="Search by title or tag..." id="lib-search" oninput="libSearch(this.value)">
      </div>
    </div>
    <div class="prompt-grid" id="prompt-grid">${promptsToShow.map(p => renderPromptCard(p, inFamilies.has(p.id))).join('') || '<div class="empty-state"><div class="empty-state-icon">&#128218;</div><div class="empty-state-text">No prompts yet</div><div class="empty-state-sub">Add your first prompt from the Inbox</div></div>'}</div>
  `;
}

function renderPromptCard(p, isInFamily) {
  const similarityBadge = p.similarityToParent > 0 ? `<span class="card-similarity-badge">${(p.similarityToParent * 100).toFixed(0)}% match</span>` : '';
  return `<div class="prompt-card" onclick="openPromptModal('${p.id}')">
    <div class="card-header">
      <div class="card-title">${escapeHtml(p.title)}${isInFamily ? '<span class="family-badge">Family</span>' : ''}</div>
      <button class="card-star ${p.starred?'starred':''}" onclick="event.stopPropagation();toggleStar('${p.id}')">${p.starred?'&#9733;':'&#9734;'}</button>
    </div>
    <div class="card-preview">${escapeHtml(p.text.substring(0, 100))}&#8230;</div>
    <div class="card-footer">
      <div class="card-tags">${p.tags.slice(0,3).map(t=>`<span class="tag" style="font-size:10px">#${t}</span>`).join('')}</div>
      <div class="card-time">${timeAgo(p.created)}</div>
    </div>
    <div style="margin-top:10px;display:flex;justify-content:space-between;align-items:center">
      ${similarityBadge}
      <span style="font-size:10px;color:var(--text4);font-family:'JetBrains Mono',monospace">${p.version}</span>
    </div>
  </div>`;
}

function setLibraryFilter(mode) {
  libraryFilterMode = mode;
  renderLibrary();
}

function libSearch(q) {
  const inFamilies = getPromptsInFamilies();
  let promptsToSearch = [];
  if(libraryFilterMode === 'unique') {
    promptsToSearch = getUniquePrompts();
  } else {
    promptsToSearch = [...DB.prompts];
  }
  const filtered = promptsToSearch.filter(p => p.title.toLowerCase().includes(q.toLowerCase()) || p.tags.some(t=>t.includes(q.toLowerCase())));
  document.getElementById('prompt-grid').innerHTML = filtered.map(p => renderPromptCard(p, inFamilies.has(p.id))).join('') || '<div class="empty-state"><div class="empty-state-text">No prompts found</div></div>';
}

function renderFamilies() {
  autoDetectAndBuildFamilies();
  if(Object.keys(DB.families).length === 0) {
    document.getElementById('content-area').innerHTML = '<div class="empty-state"><div class="empty-state-icon">&#129516;</div><div class="empty-state-text">No families yet</div><div class="empty-state-sub">Save similar prompts to automatically create families</div></div>';
    return;
  }
  document.getElementById('content-area').innerHTML = `<div class="family-grid">${Object.entries(DB.families).map(([name,fam]) => `
    <div class="prompt-card" style="cursor:default">
      <div class="card-header">
        <div class="card-title">${escapeHtml(name)}</div>
        <div class="card-time">${fam.prompts.length} version${fam.prompts.length !== 1 ? 's' : ''}</div>
      </div>
      <div style="margin-top:4px">
        ${fam.prompts.map(id => { const p = DB.prompts.find(x=>x.id===id); return p?`<div onclick="openPromptModal('${p.id}')" class="family-item-row"><div style="font-size:12.5px;font-weight:500;color:var(--text)">${escapeHtml(p.title)}</div><div style="font-size:11px;color:var(--text4);margin-top:2px">${formatDateTime(p.created)}</div></div>`:''; }).join('')}
      </div>
    </div>`).join('')}</div>`;
}

function renderFavorites() {
  const starred=DB.prompts.filter(p=>p.starred);
  document.getElementById('content-area').innerHTML=`<div class="prompt-grid">${starred.map(p=>renderPromptCard(p, false)).join('')||'<div class="empty-state"><div class="empty-state-icon">&#9733;</div><div class="empty-state-text">No favorites yet</div><div class="empty-state-sub">Star prompts to find them here quickly</div></div>'}</div>`;
}

function renderRecent() {
  document.getElementById('content-area').innerHTML=`<div class="recent-list" style="max-width:560px">${DB.recentActivity.slice(0,10).map(id=>{const p=DB.prompts.find(x=>x.id===id); return p?`<div class="recent-row" onclick="openPromptModal('${p.id}')"><div class="recent-row-icon">&#128196;</div><div style="min-width:0;flex:1"><div style="font-size:13px;font-weight:500;color:var(--text)">${escapeHtml(p.title)}</div><div style="font-size:11px;color:var(--text4);margin-top:2px">${formatDateTime(p.usedAt||p.created)}</div></div></div>`:'';}).join('')}</div>`;
}

function openPromptModal(id) {
  const p = DB.prompts.find(x=>x.id===id);
  if(!p) return;
  p.usedAt = Date.now();
  saveToLocalStorage(); // Save when prompt is used
  openModal(p.title, `
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px">${p.tags.map(t=>`<span class="tag">#${t}</span>`).join('')}<span class="tag cat">${p.category}</span><span class="tag tool">${p.tool}</span>${p.family?`<span class="tag family">${p.family}</span>`:''}</div>
    <div class="prompt-full">${escapeHtml(p.text)}</div>
    <div class="modal-meta">Created ${formatDateTime(p.created)} &nbsp;&middot;&nbsp; Last used ${formatDateTime(p.usedAt)}</div>
    <div class="modal-actions"><button class="btn btn-primary btn-sm" onclick="copyPrompt('${id}')">Copy</button><button class="btn btn-sm" onclick="toggleStar('${id}');closeModal()">${p.starred?'Unfavorite':'Favorite'}</button><button class="btn btn-sm" style="color:var(--red);border-color:var(--red);background:var(--red-bg)" onclick="deletePrompt('${id}')">Delete</button></div>
  `);
}

function copyPrompt(id) { const p=DB.prompts.find(x=>x.id===id); if(p) navigator.clipboard.writeText(p.text).then(()=>showToast('Copied to clipboard')); }
function toggleStar(id) { const p=DB.prompts.find(x=>x.id===id); if(p){p.starred=!p.starred; updateStats(); if(currentPage==='library') renderLibrary(); if(currentPage==='favorites') renderFavorites(); showToast(p.starred?'Added to favorites':'Removed from favorites'); saveToLocalStorage();} }
function deletePrompt(id) { if(confirm('Delete this prompt?')){ DB.prompts=DB.prompts.filter(p=>p.id!==id); DB.recentActivity=DB.recentActivity.filter(x=>x!==id); Object.values(DB.families).forEach(f=>f.prompts=f.prompts.filter(x=>x!==id)); closeModal(); updateStats(); if(currentPage==='library') renderLibrary(); if(currentPage==='families') renderFamilies(); showToast('Deleted'); saveToLocalStorage(); } }
function openModal(title, html) { document.getElementById('modal-title').textContent=title; document.getElementById('modal-body').innerHTML=html; document.getElementById('modal-overlay').classList.add('visible'); }
function closeModal(e) { if(!e || e.target===document.getElementById('modal-overlay')) document.getElementById('modal-overlay').classList.remove('visible'); }

// Initialize with persistence
initializeData();
updateStats();
renderInbox();
</script>
